<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 100 100" width="300" height="300" xmlns="http://www.w3.org/2000/svg">
<style>
  @media (prefers-color-scheme: dark) {:root {filter: invert(100%);}}
</style>
<circle cx="50" cy="50" r="50" style="fill: white;"/>
  <g id="arm">
    <line style="stroke: black; fill: none;" x1="50" y1="10" x2="50" y2="50"/>
    <line style="stroke: black; fill: none;" x1="40" y1="10" x2="60" y2="10"/>
    <polyline style="stroke: black; fill: none;" points="40 10 50 10 50 0" transform="rotate(45 50 10)"/>
  </g>
  <use href="#arm" transform="rotate(90 50 50)" />
  <use href="#arm" transform="rotate(180 50 50)" />
  <use href="#arm" transform="rotate(270 50 50)" />

  <use href="#arm" transform="rotate(45 50 50)" />
  <use href="#arm" transform="rotate(135 50 50)" />
  <use href="#arm" transform="rotate(225 50 50)" />
  <use href="#arm" transform="rotate(315 50 50)" />

</svg>