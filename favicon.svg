<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 100 100" width="300" height="300" xmlns="http://www.w3.org/2000/svg">
<style>
  :root {
    --bg: #fdf6e3;
    --fg: #073642;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #002b36;
      --fg: #93a1a1;
    }
  }
  .bg { fill: var(--bg); }
  .arm { stroke: var(--fg); fill: none; }
</style>
<circle class="bg" cx="50" cy="50" r="50"/>
  <g id="arm" class="arm">
    <line x1="50" y1="10" x2="50" y2="50"/>
    <line x1="40" y1="10" x2="60" y2="10"/>
    <polyline points="40 10 50 10 50 0" transform="rotate(45 50 10)"/>
  </g>
  <use href="#arm" transform="rotate(45 50 50)" />
  <use href="#arm" transform="rotate(90 50 50)" />
  <use href="#arm" transform="rotate(135 50 50)" />
  <use href="#arm" transform="rotate(180 50 50)" />
  <use href="#arm" transform="rotate(225 50 50)" />
  <use href="#arm" transform="rotate(270 50 50)" />
  <use href="#arm" transform="rotate(315 50 50)" />

</svg>