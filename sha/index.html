<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHA-generated SVG preview</title>
</head>
<body>
  <h1>SVG Preview / Download</h1>
  <p>Paste text. Each non-empty line will generate its own SVG using the first 11 characters.</p>
  <label for="textInput">Word input (first 11 characters used per line):</label><br>
  <textarea id="textInput" rows="5" placeholder="Enter
one
word
per
line"></textarea>

  <div class="controls">
    <button id="generateBtn">Generate</button>
    <button id="downloadBtn" disabled>Download SVG</button>
  </div>

  <section>
    <h2>Preview</h2>
    <div id="preview" class="preview"></div>
  </section>

  <script src="shagensvg.js"></script>
</body>
</html>
